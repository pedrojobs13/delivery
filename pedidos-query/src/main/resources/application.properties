server.port=8082
spring.application.name=pedidos-query

# Configuração oficial PostgreSQL (L1)
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_query
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

